<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>ダミーページ(テスト用。実在のサイトではありません)</title></head>
<body>
<p>これはテスト用のダミーページです。実在のサイトの画面でも、本物の領収書でもありません。</p>
<p>領収書を作成しています。しばらくお待ちください。</p>
<script>
  // 0.8 秒後に領収書のページへ移る(発行直後に「処理中」の画面をはさむサイトを模す)
  setTimeout(() => { location.replace("receipt.html" + location.search); }, 800);
</script>
</body>
</html>
