<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4fb8ff">
<title>飲みスゴロク</title>
<style>
:root {
  --navy: #2b2d5c; --cream: #fff8e7; --yellow: #ffd93d; --red: #ef233c; --ink: #2b2d5c; --muted: #6b6d8a;
  --sky: #4fb8ff; --grass: #7ed957;
  --c-start: #00a6fb; --c-goal: #ff6b35; --c-rest: #3b8cff; --c-self: #ff9f1c; --c-pick: #9b5de5; --c-all: #2ec27e; --c-chug: #ef233c;
  --gap: 16px;
}
* { box-sizing: border-box; }
html, body { margin: 0; color: var(--ink); background: var(--sky);
  font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
  font-weight: 700; -webkit-text-size-adjust: 100%; }
body { min-height: 100dvh; }
body::before { content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: linear-gradient(180deg, #4fb8ff 0%, #9ddcff 60%, #d9f3ff 100%); }
.clouds { position: fixed; left: 0; top: 0; width: 100%; height: 260px; z-index: -1; pointer-events: none; opacity: .95;
  background-image:
    radial-gradient(circle at 70px 70px, #fff 0 26px, transparent 27px),
    radial-gradient(circle at 110px 56px, #fff 0 36px, transparent 37px),
    radial-gradient(circle at 156px 74px, #fff 0 24px, transparent 25px),
    radial-gradient(circle at 420px 40px, #fff 0 20px, transparent 21px),
    radial-gradient(circle at 452px 28px, #fff 0 30px, transparent 31px),
    radial-gradient(circle at 492px 44px, #fff 0 18px, transparent 19px);
  background-size: 640px 260px; background-repeat: repeat-x; animation: drift 80s linear infinite; }
@keyframes drift { to { background-position-x: -640px; } }
.screen { max-width: 960px; margin: 0 auto; padding: 16px; padding-bottom: calc(32px + env(safe-area-inset-bottom)); }
[hidden] { display: none !important; }
.cat-start { --cat: var(--c-start); } .cat-goal { --cat: var(--c-goal); } .cat-rest { --cat: var(--c-rest); }
.cat-self { --cat: var(--c-self); } .cat-pick { --cat: var(--c-pick); } .cat-all { --cat: var(--c-all); } .cat-chug { --cat: var(--c-chug); }
svg { display: block; }

/* ---- 共通パーツ(太い縁取り + ずらし影) ---- */
.outline { color: #fff; -webkit-text-stroke: 4px var(--navy); paint-order: stroke fill; text-shadow: 0 3px 0 var(--navy); }
.title { font-size: 2.2rem; font-weight: 900; margin: 10px 0 18px; text-align: center; line-height: 1.3; }
.title .stroke { color: var(--yellow); -webkit-text-stroke: 7px var(--navy); paint-order: stroke fill; text-shadow: 0 5px 0 var(--navy); }
h2 { font-size: .95rem; margin: 22px 0 8px; font-weight: 900; }
h2::before { content: '▶ '; color: var(--red); }
.panel { background: var(--cream); border: 3px solid var(--navy); border-radius: 16px; box-shadow: 4px 4px 0 var(--navy); }
.btn { font: inherit; font-weight: 900; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 14px;
  padding: 12px 16px; box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 4px 0 var(--navy); cursor: pointer; touch-action: manipulation;
  transition: transform .05s, box-shadow .05s; }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 0 0 var(--navy); }
.btn:disabled { opacity: .6; cursor: default; }
.btn-primary { background: linear-gradient(#ffe978, #ffd93d); width: 100%; font-size: 1.2rem; padding: 14px; }
.btn-ghost { font-size: .9rem; padding: 8px 12px; box-shadow: 0 3px 0 var(--navy); }
.avatar { display: inline-flex; width: 44px; height: 44px; border-radius: 50%; background: #fff; border: 3px solid var(--c, var(--navy));
  box-shadow: 0 0 0 2px var(--navy); overflow: hidden; flex: none; }
.avatar svg { width: 100%; height: 100%; }
.avatar.sm { width: 22px; height: 22px; border-width: 2px; box-shadow: 0 0 0 1.5px var(--navy); }
.avatar.lg { width: 72px; height: 72px; border-width: 4px; }

/* ---- セットアップ ---- */
.choices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.choice { padding: 10px 4px; text-align: center; background: #fff; border: 3px solid var(--navy); border-radius: 14px; box-shadow: 0 4px 0 var(--navy);
  cursor: pointer; font: inherit; color: var(--navy); touch-action: manipulation; }
.choice .big { font-size: 1.25rem; font-weight: 900; display: block; }
.choice .hint { font-size: .68rem; color: var(--muted); display: block; margin-top: 4px; line-height: 1.3; }
.choice[aria-pressed="true"] { background: var(--yellow); transform: translateY(4px); box-shadow: none; }
.player-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
.player-avatar { padding: 0; width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--c, var(--navy)); background: #fff;
  box-shadow: 0 0 0 2px var(--navy), 0 4px 0 2px var(--navy); cursor: pointer; overflow: hidden; flex: none; }
.player-avatar:active { transform: translateY(3px); box-shadow: 0 0 0 2px var(--navy); }
.player-avatar svg { width: 100%; height: 100%; }
.player-row input { flex: 1; min-width: 0; font: inherit; font-weight: 700; font-size: 1rem; padding: 11px 12px; border-radius: 12px;
  border: 3px solid var(--navy); background: #fff; color: var(--navy); }
.player-row input::placeholder { color: #b0b2c8; }
.player-row .btn { padding: 9px 12px; }
.hint-text { font-size: .75rem; color: var(--muted); margin: -2px 0 10px 2px; }
#add-player { width: 100%; margin-top: 4px; }
.notice { font-size: .8rem; padding: 10px 12px; margin: 18px 0; line-height: 1.6; }
.banner { padding: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.banner span { flex: 1; font-weight: 900; }
.banner .btn-primary { width: auto; font-size: 1rem; padding: 10px 16px; }
.picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pick { font: inherit; font-weight: 900; font-size: .68rem; color: var(--navy); background: #fff; border: 3px solid var(--navy); border-radius: 14px;
  box-shadow: 0 4px 0 var(--navy); padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
.pick svg { width: 48px; height: 48px; }
.pick.selected { background: var(--yellow); transform: translateY(4px); box-shadow: none; }
.pick:disabled { opacity: .35; cursor: default; }

/* ---- ゲーム ---- */
#screen-play { padding-top: 0; }
.topbar { position: sticky; top: 0; z-index: 5; padding: 10px 0 8px; background: linear-gradient(var(--sky) 0%, var(--sky) 86%, transparent); }
.turn { display: flex; align-items: center; gap: 10px; padding: 6px 10px 6px 8px; margin-bottom: 10px; }
#turn-name { font-size: 1.2rem; font-weight: 900; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-roll { display: flex; justify-content: center; align-items: center; gap: 14px; font-size: 1.3rem; }
.die { display: inline-grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 44px; height: 44px; flex: none;
  background: linear-gradient(145deg, #fff, #e4e7ff); border: 3px solid var(--navy); border-radius: 10px; padding: 4px; box-shadow: 2px 3px 0 var(--navy), inset -3px -3px 0 rgba(43,45,92,.12); }
.die .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--navy); align-self: center; justify-self: center; box-shadow: inset 1px 1px 0 rgba(255,255,255,.35); }
.die.rolling { animation: shake .12s infinite; }
@keyframes shake { 0% { transform: rotate(-14deg) translateY(-2px); } 50% { transform: rotate(12deg) translateY(2px); } 100% { transform: rotate(-14deg) translateY(-2px); } }
.standings { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 4px; scrollbar-width: none; }
.standings::-webkit-scrollbar { display: none; }
.chip { flex: none; font-size: .78rem; padding: 3px 10px 3px 4px; border-radius: 999px; background: #fff; border: 2px solid var(--navy); display: flex; align-items: center; gap: 6px; }
.chip.current { background: var(--yellow); }
.board-wrap { background: var(--grass); border: 3px solid var(--navy); border-radius: 18px; padding: 10px; box-shadow: 4px 4px 0 var(--navy); margin-top: 8px;
  background-image: linear-gradient(45deg, rgba(255,255,255,.1) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.1) 50%, rgba(255,255,255,.1) 75%, transparent 75%);
  background-size: 26px 26px; }
.board { display: grid; gap: var(--gap); position: relative; z-index: 0; }
.tile { position: relative; aspect-ratio: 1; border-radius: 12px; background: var(--cream); border: 3px solid var(--navy); box-shadow: 3px 3px 0 var(--navy);
  min-width: 0; cursor: pointer; user-select: none; -webkit-user-select: none; }
.tile .band { position: absolute; left: 0; right: 0; top: 0; height: 30%; background: var(--cat); border-radius: 8px 8px 0 0; border-bottom: 3px solid var(--navy); }
.tile .num, .tile .label { position: absolute; top: 1px; font-size: .62rem; font-weight: 900; color: #fff; line-height: 1.6;
  text-shadow: 1px 0 0 var(--navy), -1px 0 0 var(--navy), 0 1px 0 var(--navy), 0 -1px 0 var(--navy), 1px 1px 0 var(--navy), -1px -1px 0 var(--navy), 1px -1px 0 var(--navy), -1px 1px 0 var(--navy); }
.tile .num { left: 5px; } .tile .label { right: 5px; }
.tile .icon { position: absolute; left: 22%; right: 22%; top: 36%; bottom: 10%; }
.tile .icon svg { width: 100%; height: 100%; }
.tile.active { outline: 4px solid var(--yellow); outline-offset: 1px; }
.tile.landed { animation: pop .35s ease; }
@keyframes pop { 50% { transform: scale(1.1); } }
/* 線路(蛇行の向きに隣のマスへ) */
.tile::after { content: ''; position: absolute; z-index: -1; display: none; background: var(--navy); }
.tile.link-right::after, .tile.link-left::after { display: block; top: 50%; height: 12px; width: calc(var(--gap) + 14px); transform: translateY(-50%);
  background: linear-gradient(var(--yellow), var(--yellow)) center / 100% 4px no-repeat, var(--navy); }
.tile.link-right::after { left: 100%; }
.tile.link-left::after { right: 100%; }
.tile.link-down::after { display: block; left: 50%; width: 12px; height: calc(var(--gap) + 14px); top: 100%; transform: translateX(-50%);
  background: linear-gradient(var(--yellow), var(--yellow)) center / 4px 100% no-repeat, var(--navy); }
/* 駒(キャラクター) */
.tokens { position: absolute; left: 0; right: 0; bottom: 2px; display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; z-index: 2; }
.token { width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 2px solid var(--c); box-shadow: 0 0 0 2px var(--navy); overflow: hidden; flex: none;
  transition: transform .15s; }
.token svg { width: 100%; height: 100%; }
.tokens.n2 .token { width: 22px; height: 22px; }
.tokens.many { gap: 1px; }
.tokens.many .token { width: 13px; height: 13px; border-width: 1.5px; box-shadow: 0 0 0 1.5px var(--navy); }
.token.moving { transform: scale(1.35) translateY(-5px); z-index: 3; }

/* ---- 指令カード(メッセージ窓) ---- */
.overlay { position: fixed; inset: 0; background: rgba(43,45,92,.55); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 20; overflow-y: auto; }
.card { width: min(480px, 100%); background: var(--cream); border: 4px solid var(--navy); border-radius: 20px; box-shadow: 6px 6px 0 var(--navy);
  overflow: hidden; animation: bounce-in .35s cubic-bezier(.2,1.4,.5,1); position: relative; }
@keyframes bounce-in { from { transform: scale(.7); opacity: 0; } }
.card-band { background: var(--cat, var(--c-rest)); padding: 8px 12px; display: flex; align-items: center; justify-content: center; gap: 10px; border-bottom: 4px solid var(--navy); }
.card-band .icon svg { width: 44px; height: 44px; }
.card-band .cat { font-size: 1.5rem; font-weight: 900; letter-spacing: .08em; }
.card-body { padding: 14px 18px 20px; text-align: center; }
.card .speaker { display: flex; justify-content: center; margin: 2px 0 8px; }
.card .who { font-size: .9rem; color: var(--muted); }
.card .sub { font-size: .95rem; color: var(--red); font-weight: 900; margin-top: 4px; min-height: 1.2em; }
.card .text { font-size: 1.35rem; font-weight: 900; line-height: 1.5; margin: 10px 0 18px; overflow-wrap: anywhere; position: relative;
  background: #fff; border: 3px solid var(--navy); border-radius: 16px; padding: 14px 14px; }
.card .text::before { content: ''; position: absolute; top: -12px; left: 50%; width: 18px; height: 18px; background: #fff; border-left: 3px solid var(--navy); border-top: 3px solid var(--navy);
  transform: translateX(-50%) rotate(45deg); }
.card .extra { margin-bottom: 14px; }
.card .extra .btn { display: inline-flex; align-items: center; gap: 10px; }
.card .extra .result { font-size: 1.4rem; font-weight: 900; min-height: 1.4em; margin-top: 10px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 21; }
.confetti i { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 2px; animation: fall 2.8s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }
#peek { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 12px 14px; z-index: 10; font-size: .95rem; line-height: 1.5; cursor: pointer; }
#peek .head { font-size: .75rem; color: var(--muted); margin-bottom: 2px; }

/* ---- 結果 ---- */
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin: 6px 0 18px; }
.podium .spot { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 31%; }
.podium .spot .pname { font-weight: 900; font-size: .9rem; text-align: center; overflow-wrap: anywhere; line-height: 1.2; }
.podium .block { width: 100%; border: 3px solid var(--navy); border-radius: 10px 10px 0 0; box-shadow: 4px 4px 0 var(--navy); display: flex; align-items: center; justify-content: center; font-size: 1.7rem; }
.podium .p1 .block { height: 88px; background: linear-gradient(#ffe978, #ffd93d); }
.podium .p2 .block { height: 66px; background: linear-gradient(#fff, #dfe3f0); }
.podium .p3 .block { height: 50px; background: linear-gradient(#f3c28f, #e8a86b); }
.podium .p1 .avatar { width: 64px; height: 64px; }
.rank-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; margin-bottom: 10px; background: #fff; }
.rank-row .medal { font-size: 1rem; width: 2.2em; text-align: center; color: var(--muted); }
.rank-row .name { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rank-row .name b { font-weight: 900; font-size: 1.05rem; overflow-wrap: anywhere; }
.rank-row .note { font-size: .78rem; color: var(--red); }
.rank-row.last { border-color: var(--red); box-shadow: 4px 4px 0 var(--red); }
.last-note { text-align: center; font-weight: 900; color: var(--red); margin: 4px 0 10px; }
.actions { display: grid; gap: 12px; margin-top: 18px; }
.actions .btn { width: 100%; }
@media (prefers-reduced-motion: reduce) { .tile.landed, .card, .die.rolling, .clouds, .confetti i { animation: none; } }
</style>
</head>
<body>
<div class="clouds" aria-hidden="true"></div>
<main>
<section id="screen-setup" class="screen">
  <h1 class="title">🍻 <span class="stroke">飲みスゴロク</span></h1>
  <div id="resume-banner" class="banner panel" hidden>
    <span>前回の続きがあります</span>
    <button id="resume" class="btn btn-primary">続きから</button>
    <button id="discard" class="btn btn-ghost">破棄</button>
  </div>
  <h2>マス数</h2>
  <div class="choices" id="size-choices"></div>
  <h2>難易度</h2>
  <div class="choices" id="diff-choices"></div>
  <h2>プレイヤー(2〜8人)</h2>
  <p class="hint-text">顔をタップするとキャラクターを選べます</p>
  <div id="players"></div>
  <button id="add-player" class="btn">＋ プレイヤーを追加</button>
  <p class="notice panel">飲めない人はソフトドリンクでOK。無理な飲酒は絶対にしないこと。<br>ゴールはぴったり止まる必要があります。超えた分は折り返して戻ります。<br>100マス × 鬼はかなりの量になります。</p>
  <button id="start" class="btn btn-primary">ゲームスタート</button>
</section>

<section id="screen-play" class="screen" hidden>
  <div class="topbar">
    <div class="turn panel">
      <span class="avatar" id="turn-avatar"></span>
      <span id="turn-name"></span>
      <button id="end" class="btn btn-ghost">終了</button>
    </div>
    <button id="roll" class="btn btn-primary btn-roll"><span class="die" id="die"></span><span id="roll-label">サイコロを振る</span></button>
    <div class="standings" id="standings"></div>
  </div>
  <div class="board-wrap"><div class="board" id="board"></div></div>
</section>

<section id="screen-result" class="screen" hidden>
  <h1 class="title">🏁 <span class="stroke">結果発表</span></h1>
  <div class="podium" id="podium"></div>
  <div id="ranking"></div>
  <div class="actions">
    <button id="again" class="btn btn-primary">同じ設定でもう一度</button>
    <button id="to-setup" class="btn">設定に戻る</button>
  </div>
</section>
</main>

<div id="picker-overlay" class="overlay" hidden>
  <div id="picker" class="card cat-goal">
    <div class="card-band"><span class="cat outline">キャラクターをえらぶ</span></div>
    <div class="card-body">
      <div class="picks" id="picks"></div>
      <button id="picker-close" class="btn" style="margin-top:14px;width:100%">とじる</button>
    </div>
  </div>
</div>

<div id="card-overlay" class="overlay" hidden>
  <div id="card" class="card">
    <div class="card-band"><span class="icon" id="card-icon"></span><span class="cat outline" id="card-cat"></span></div>
    <div class="card-body">
      <div class="speaker"><span class="avatar lg" id="card-avatar"></span></div>
      <div class="who" id="card-who"></div>
      <div class="sub" id="card-sub"></div>
      <div class="text" id="card-text"></div>
      <div class="extra" id="card-extra" hidden>
        <button id="extra-dice" class="btn"><span class="die" id="extra-die"></span>サイコロを振る</button>
        <div class="result" id="extra-result"></div>
      </div>
      <button id="card-ok" class="btn btn-primary">OK!</button>
    </div>
  </div>
</div>
<div id="confetti" class="confetti" hidden></div>
<div id="peek" class="panel" hidden></div>

<script id="sugoroku-logic">
// ===== ゲームロジック(純粋関数。DOM・localStorage に依存しない) =====
const Sugoroku = (() => {
  'use strict';

  const SIZES = [16, 32, 50, 100];

  const DIFFICULTIES = {
    easy:   { label: '優しめ', hint: 'グラスの3分の1',   drink: 'グラスの3分の1を飲む', double: 'グラスの3分の2を飲む',
              ratios: { rest: 40, self: 30, pick: 20, all: 10, chug: 0 } },
    normal: { label: '普通',   hint: 'グラスの半分',     drink: 'グラスの半分を飲む',   double: 'グラス1杯を飲む',
              ratios: { rest: 25, self: 30, pick: 25, all: 12, chug: 8 } },
    hard:   { label: '難しい', hint: 'グラス1杯を一気',  drink: 'グラス1杯を一気!',     double: 'グラス2杯を一気!',
              ratios: { rest: 12, self: 30, pick: 28, all: 15, chug: 15 } },
    oni:    { label: '鬼',     hint: '全部ショット',     drink: 'ショット1杯!',         double: 'ショット2杯!',
              ratios: { rest: 0, self: 25, pick: 30, all: 20, chug: 25 } },
  };

  const CATS = {
    start: { icon: '🚩', label: 'START' },
    goal:  { icon: '🏁', label: 'GOAL' },
    rest:  { icon: '😌', label: '休憩' },
    self:  { icon: '🍺', label: '自分' },
    pick:  { icon: '👉', label: '指名' },
    all:   { icon: '🍻', label: '全員' },
    chug:  { icon: '🔥', label: '一気' },
  };

  // {drink} = 1人分の基本量、{double} = 一気マス用の重い量(難易度で置換)
  const TEXTS = {
    self: [
      'あなたが{drink}',
      '立ち上がって{drink}',
      '全員の手拍子の中で{drink}',
      '右隣の人と乾杯してから、あなただけ{drink}',
      '利き手と逆の手で{drink}',
      '全員に「いつもありがとう」と言ってから{drink}',
      '今の順位を大声で宣言してから{drink}',
      '目を閉じて{drink}',
      '一番好きな食べ物を言ってから{drink}',
      { text: 'もう1回サイコロを振る。奇数なら{drink}、偶数ならセーフ', extraDice: true },
      { text: 'もう1回サイコロを振る。4以上ならあなたが{drink}、3以下なら右隣の人が{drink}', extraDice: true },
      'ものまねを1つ披露してから{drink}',
      '最近あった嬉しいことを1つ話してから{drink}',
      '全員と目を合わせてから{drink}',
    ],
    pick: [
      '好きな人を1人指名。その人が{drink}',
      '右隣の人が{drink}',
      '左隣の人が{drink}',
      '自分より進んでいる人全員が{drink}。いなければあなたが{drink}',
      '自分より遅れている人全員が{drink}。いなければあなたが{drink}',
      '今トップの人が{drink}(あなたなら右隣の人)',
      '今ビリの人が{drink}(あなたなら左隣の人)',
      '右隣の人とじゃんけん。負けた方が{drink}',
      '左隣の人とじゃんけん。負けた方が{drink}',
      '一番最近トイレに行った人が{drink}',
      '一番遅く集合した人が{drink}',
      '好きな人を指名して、あなたとその人の2人で{drink}',
      '一番年上の人が{drink}',
      '一番年下の人が{drink}',
      'スマホの充電が一番少ない人が{drink}',
      'あなたの両隣の2人が{drink}',
      '誕生日が一番近い人が{drink}',
    ],
    all: [
      '全員で乾杯して{drink}',
      'あなた以外の全員が{drink}',
      '全員でじゃんけん。最後まで勝ち残った1人だけ免除、他は{drink}',
      '全員が同時に{drink}。一番遅かった人はもう1回',
      'あなたが乾杯の音頭を取って、全員が{drink}',
      '全員が{drink}。ゴール済みの人も参加',
      '全員立ち上がって{drink}。飲み終わった人から座る',
      '全員で「お疲れさま!」と叫んでから{drink}',
    ],
    chug: [
      'あなたが{double}',
      '好きな人を1人指名。その人が{double}',
      '全員でじゃんけん。最後まで負け残った人が{double}',
      '全員が{drink}。あなたは{double}',
      '右隣の人とあなたの2人が{double}',
      { text: 'もう1回サイコロを振る。偶数なら{double}、奇数なら{drink}', extraDice: true },
      '今ビリの人とあなたが{double}(あなたがビリなら右隣の人と)',
      '全員が{double}',
    ],
  };

  // ---- ユーティリティ ----
  function shuffle(arr, rng) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /** 最大剰余法: 合計 n になるように割合からカテゴリ別個数を出す。 */
  function largestRemainder(n, ratios) {
    const cats = Object.keys(ratios);
    const raw = cats.map((k) => (n * ratios[k]) / 100);
    const base = raw.map(Math.floor);
    let rest = n - base.reduce((a, b) => a + b, 0);
    const order = cats
      .map((k, i) => ({ i, r: raw[i] - base[i] }))
      .sort((a, b) => b.r - a.r || a.i - b.i);
    for (const o of order) {
      if (rest <= 0) break;
      base[o.i] += 1;
      rest -= 1;
    }
    const out = {};
    cats.forEach((k, i) => { out[k] = base[i]; });
    return out;
  }

  function fillText(text, diff) {
    return text.replace(/\{drink\}/g, diff.drink).replace(/\{double\}/g, diff.double);
  }

  /** カテゴリごとに文言を順に配る。プールを使い切ったら再シャッフル。 */
  function makeDealer(rng) {
    const state = {};
    return (cat) => {
      let s = state[cat];
      if (!s || s.i >= s.pool.length) {
        s = state[cat] = { pool: shuffle(TEXTS[cat], rng), i: 0 };
      }
      const entry = s.pool[s.i++];
      return typeof entry === 'string' ? { text: entry } : entry;
    };
  }

  /**
   * 指令マスのカテゴリ列を作る(長さ n、tile 1..n に対応)。
   * - 一気(chug)は隣接しない
   * - tile 1〜3 に一気・全員を置かない
   * 一気以外を並べてから、一気を「隙間」に1個ずつ差し込む構成的な方法で作る。
   */
  function arrangeCats(counts, rng) {
    const others = [];
    for (const cat of Object.keys(counts)) {
      if (cat === 'chug') continue;
      for (let i = 0; i < counts[cat]; i++) others.push(cat);
    }
    let base = shuffle(others, rng);
    // 先頭3つに all があれば、後ろの all 以外と入れ替える
    for (let i = 0; i < Math.min(3, base.length); i++) {
      if (base[i] !== 'all') continue;
      const candidates = [];
      for (let j = 3; j < base.length; j++) if (base[j] !== 'all') candidates.push(j);
      if (candidates.length === 0) break;
      const j = candidates[Math.floor(rng() * candidates.length)];
      [base[i], base[j]] = [base[j], base[i]];
    }
    // 一気を差し込む隙間(gap g は base[g] の直前。g >= 3 のみ許可)
    const k = counts.chug || 0;
    const gaps = [];
    for (let g = 3; g <= base.length; g++) gaps.push(g);
    const chosen = new Set(shuffle(gaps, rng).slice(0, k));
    const out = [];
    for (let g = 0; g <= base.length; g++) {
      if (chosen.has(g)) out.push('chug');
      if (g < base.length) out.push(base[g]);
    }
    return out;
  }

  function generateBoard(size, difficulty, rng = Math.random) {
    if (!SIZES.includes(size)) throw new Error('マス数が不正: ' + size);
    const diff = DIFFICULTIES[difficulty];
    if (!diff) throw new Error('難易度が不正: ' + difficulty);
    const n = size - 2;
    const counts = largestRemainder(n, diff.ratios);
    const cats = arrangeCats(counts, rng);
    const deal = makeDealer(rng);
    const board = [{ index: 0, cat: 'start' }];
    cats.forEach((cat, i) => {
      const tile = { index: i + 1, cat };
      if (cat !== 'rest') {
        const entry = deal(cat);
        tile.text = fillText(entry.text, diff);
        if (entry.extraDice) tile.extraDice = true;
      }
      board.push(tile);
    });
    board.push({ index: size - 1, cat: 'goal' });
    return board;
  }

  // ---- ゲーム進行 ----
  const MIN_PLAYERS = 2;
  const MAX_PLAYERS = 8;
  const PLAYER_COLORS = ['#ff4d4d', '#3b8cff', '#2ec27e', '#ffd93d', '#b56cff', '#ff9f1c', '#4dd4e8', '#ff7bd2'];

  const CHARACTERS = [
    { id: 'momotaro', name: 'ももたろう' },
    { id: 'kintaro', name: 'きんたろう' },
    { id: 'urashima', name: 'うらしまたろう' },
    { id: 'kaguya', name: 'かぐやひめ' },
    { id: 'issun', name: 'いっすんぼうし' },
    { id: 'akaoni', name: 'あかおに' },
    { id: 'aooni', name: 'あおおに' },
    { id: 'inu', name: 'いぬ' },
    { id: 'saru', name: 'さる' },
    { id: 'kiji', name: 'きじ' },
    { id: 'kappa', name: 'かっぱ' },
    { id: 'binbo', name: 'びんぼうがみ' },
  ];

  function clone(state) { return JSON.parse(JSON.stringify(state)); }

  /** キャラ指定を検証して配列で返す。未指定なら先頭から順に割り当てる。 */
  function resolveChars(chars, count) {
    const ids = CHARACTERS.map((c) => c.id);
    if (chars == null) return ids.slice(0, count);
    if (!Array.isArray(chars) || chars.length !== count) throw new Error('キャラの数が人数と合いません');
    for (const c of chars) if (!ids.includes(c)) throw new Error('不明なキャラ: ' + c);
    if (new Set(chars).size !== chars.length) throw new Error('キャラが重複しています');
    return chars.slice();
  }

  function createGame({ size, difficulty, names, chars, rng = Math.random }) {
    if (!Array.isArray(names) || names.length < MIN_PLAYERS || names.length > MAX_PLAYERS) {
      throw new Error(`プレイヤーは${MIN_PLAYERS}〜${MAX_PLAYERS}人`);
    }
    const charList = resolveChars(chars, names.length);
    const board = generateBoard(size, difficulty, rng);
    const players = names.map((raw, i) => ({
      name: (String(raw ?? '').trim()) || `プレイヤー${i + 1}`,
      color: PLAYER_COLORS[i],
      char: charList[i],
      pos: 0,
      rank: null,
    }));
    return { version: 1, size, difficulty, board, players, turn: 0, phase: 'play', nextRank: 1, lastMove: null };
  }

  function applyRoll(state, roll) {
    if (state.phase !== 'play') throw new Error('ゲームは終了しています');
    if (!Number.isInteger(roll) || roll < 1 || roll > 6) throw new Error('出目が不正: ' + roll);
    const s = clone(state);
    const p = s.players[s.turn];
    if (p.rank !== null) throw new Error('ゴール済みのプレイヤーです');
    const goal = s.size - 1;
    const path = [];
    let pos = p.pos;
    let dir = 1;
    for (let i = 0; i < roll; i++) {
      if (pos === goal) dir = -1; // ゴールで折り返し
      pos += dir;
      path.push(pos);
    }
    const bounced = dir === -1;
    const finished = pos === goal;
    p.pos = pos;
    if (finished) {
      p.rank = s.nextRank;
      s.nextRank += 1;
    }
    s.lastMove = { player: s.turn, roll, from: state.players[state.turn].pos, to: pos, path, bounced, finished };
    return s;
  }

  function endTurn(state) {
    const s = clone(state);
    s.lastMove = null;
    const n = s.players.length;
    for (let k = 1; k <= n; k++) {
      const i = (s.turn + k) % n;
      if (s.players[i].rank === null) {
        s.turn = i;
        return s;
      }
    }
    s.phase = 'result';
    return s;
  }

  function finishEarly(state) {
    const s = clone(state);
    const pending = s.players
      .map((p, i) => ({ p, i }))
      .filter(({ p }) => p.rank === null)
      .sort((a, b) => b.p.pos - a.p.pos || a.i - b.i);
    for (const { p } of pending) {
      p.rank = s.nextRank;
      s.nextRank += 1;
    }
    s.lastMove = null;
    s.phase = 'result';
    return s;
  }

  function ranking(state) {
    return state.players.slice().sort((a, b) => a.rank - b.rank);
  }

  return {
    SIZES, DIFFICULTIES, CATS, TEXTS, CHARACTERS, MIN_PLAYERS, MAX_PLAYERS, PLAYER_COLORS,
    generateBoard, largestRemainder, createGame, applyRoll, endTurn, finishEarly, ranking,
  };
})();
</script>

    `<rect x="4" y="4" width="28" height="30" rx="5" fill="#ffb703" ${S3}/>` +
    `<circle cx="9" cy="4" r="6" fill="#fff" ${S3}/><circle cx="18" cy="1" r="7" fill="#fff" ${S3}/><circle cx="27" cy="4" r="6" fill="#fff" ${S3}/>` +
    `<circle cx="12" cy="24" r="2" fill="#fff" opacity=".8"/><circle cx="22" cy="18" r="1.6" fill="#fff" opacity=".8"/></g>`;
  const star = (x, y, s = 1) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 -8 l2.4 5.2 l5.6 .8 l-4 4 l1 5.6 l-5 -2.6 l-5 2.6 l1 -5.6 l-4 -4 l5.6 -.8 Z" fill="#ffd93d" ${S3}/>`;
  const ICON_ART = {
    self: () => wrap(mug(12, 14), '0 0 64 64'),
    all: () => wrap(`<g transform="rotate(-18 20 40)">${mug(4, 20, .8)}</g><g transform="rotate(18 44 40)">${mug(30, 20, .8)}</g>${star(32, 12, 1)}${star(10, 14, .55)}${star(54, 14, .55)}`, '0 0 64 64'),
    pick: () => wrap(
      `<rect x="26" y="26" width="32" height="11" rx="5.5" fill="${SKIN}" ${S3}/>` +
      `<rect x="8" y="22" width="28" height="30" rx="9" fill="${SKIN}" ${S3}/>` +
      `<path d="M20 33 h10 M20 41 h10" fill="none" ${S3}/><path d="M14 22 q6 -9 13 0" fill="${SKIN}" ${S3}/>`, '0 0 64 64'),
    chug: () => wrap(
      `<path d="M32 6 C26 18 14 22 14 38 a18 18 0 0 0 36 0 c0 -10 -6 -14 -9 -21 c-2 6 -5 8 -7 6 c4 -8 2 -14 -2 -17 Z" fill="#ff6b35" ${S3}/>` +
      `<path d="M32 30 c-5 6 -8 10 -8 16 a8 8 0 0 0 16 0 c0 -6 -3 -10 -8 -16 Z" fill="#ffd93d"/>`, '0 0 64 64'),
    rest: () => wrap(
      `<ellipse cx="30" cy="56" rx="22" ry="4.5" fill="#fff" ${S3}/>` +
      `<path d="M14 28 h32 v12 a16 16 0 0 1 -32 0 Z" fill="#7ed957" ${S3}/><ellipse cx="30" cy="28" rx="16" ry="4.5" fill="#b7e4a3" ${S3}/>` +
      `<path d="M46 32 h5 a6 6 0 0 1 0 12 h-5" fill="#fff" ${S3}/>` +
      `<path d="M22 20 q4 -5 0 -11 M32 20 q4 -5 0 -11" fill="none" stroke="${N}" stroke-width="3" stroke-linecap="round" opacity=".6"/>`, '0 0 64 64'),
    start: () => wrap(`<path d="M18 8 v50" stroke="${N}" stroke-width="5" stroke-linecap="round"/><path d="M21 10 h32 l-9 11 l9 11 h-32 Z" fill="#ff4d4d" ${S3}/>`, '0 0 64 64'),
    goal: () => wrap(
      `<path d="M18 8 v50" stroke="${N}" stroke-width="5" stroke-linecap="round"/><path d="M21 10 h34 v24 h-34 Z" fill="#fff" ${S3}/>` +
      [[21, 10], [38, 10], [29.5, 18], [46.5, 18], [21, 26], [38, 26]].map(([x, y]) => `<rect x="${x}" y="${y}" width="8.5" height="8" fill="${N}"/>`).join(''), '0 0 64 64'),
  };
  return { CHAR_ART, ICON_ART };
})();
</script>

<script>
// ===== 表示層(DOM・localStorage・アニメーション) =====
(() => {
  'use strict';
  const S = Sugoroku;
  const { CHAR_ART, ICON_ART } = SugorokuArt;
  const $ = (id) => document.getElementById(id);
  const KEY_GAME = 'sugoroku.v1.game';
  const KEY_SETUP = 'sugoroku.v1.setup';
  const CHAR_IDS = S.CHARACTERS.map((c) => c.id);
  const CHAR_NAME = Object.fromEntries(S.CHARACTERS.map((c) => [c.id, c.name]));
  // サイコロの目ごとのピップ位置(3x3 の行/列)
  const PIPS = { 1: [[2, 2]], 2: [[1, 3], [3, 1]], 3: [[1, 3], [2, 2], [3, 1]], 4: [[1, 1], [1, 3], [3, 1], [3, 3]],
    5: [[1, 1], [1, 3], [2, 2], [3, 1], [3, 3]], 6: [[1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]] };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, reduced ? 0 : ms));

  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* 保存できなくても動く */ } },
    del(k) { try { localStorage.removeItem(k); } catch { /* 同上 */ } },
  };

  let state = null;                 // ゲーム状態。Sugoroku の純粋関数でのみ更新する
  let setup = { size: 16, difficulty: 'normal', names: ['', ''], chars: CHAR_IDS.slice(0, 2) };
  let busy = false;                 // サイコロ・移動アニメ中
  let visPos = null;                // アニメ中の駒の見た目位置 { player, pos }
  let cols = 4;
  let peekTimer = null;
  let pickingFor = null;            // キャラ選択中のプレイヤー添字

  function show(id) {
    for (const s of document.querySelectorAll('.screen')) s.hidden = s.id !== id;
    window.scrollTo(0, 0);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function setAvatar(el, charId, color) {
    el.dataset.char = charId;
    el.style.setProperty('--c', color);
    el.innerHTML = CHAR_ART[charId]();
  }

  function renderDie(el, face) {
    el.dataset.face = face;
    el.innerHTML = '';
    for (const [r, c] of PIPS[face]) {
      const pip = document.createElement('span');
      pip.className = 'pip';
      pip.style.gridArea = `${r} / ${c}`;
      el.appendChild(pip);
    }
  }

  /** サイコロをガタガタ回してから最終の目を見せる。 */
  async function spinDie(el, finalFace, ms) {
    el.classList.add('rolling');
    const t0 = Date.now();
    while (!reduced && Date.now() - t0 < ms) {
      renderDie(el, 1 + Math.floor(Math.random() * 6));
      await sleep(70);
    }
    el.classList.remove('rolling');
    renderDie(el, finalFace);
  }

  // ---------- セットアップ ----------
  function renderChoices() {
    const sc = $('size-choices');
    sc.innerHTML = '';
    for (const size of S.SIZES) {
      const b = document.createElement('button');
      b.className = 'choice';
      b.dataset.size = size;
      b.setAttribute('aria-pressed', String(size === setup.size));
      b.innerHTML = `<span class="big">${size}</span><span class="hint">マス</span>`;
      b.addEventListener('click', () => { setup.size = size; renderChoices(); });
      sc.appendChild(b);
    }
    const dc = $('diff-choices');
    dc.innerHTML = '';
    for (const [key, d] of Object.entries(S.DIFFICULTIES)) {
      const b = document.createElement('button');
      b.className = 'choice';
      b.dataset.diff = key;
      b.setAttribute('aria-pressed', String(key === setup.difficulty));
      b.innerHTML = `<span class="big">${d.label}</span><span class="hint">${d.hint}</span>`;
      b.addEventListener('click', () => { setup.difficulty = key; renderChoices(); });
      dc.appendChild(b);
    }
  }

  function firstFreeChar() {
    return CHAR_IDS.find((id) => !setup.chars.includes(id));
  }

  function renderPlayers() {
    const wrap = $('players');
    wrap.innerHTML = '';
    setup.names.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'player-row';
      const av = document.createElement('button');
      av.className = 'player-avatar';
      av.type = 'button';
      av.setAttribute('aria-label', 'キャラクターを選ぶ');
      setAvatar(av, setup.chars[i], S.PLAYER_COLORS[i]);
      av.addEventListener('click', () => openPicker(i));
      const input = document.createElement('input');
      input.className = 'player-name';
      input.placeholder = `プレイヤー${i + 1}`;
      input.maxLength = 12;
      input.value = name;
      input.addEventListener('input', () => { setup.names[i] = input.value; });
      const del = document.createElement('button');
      del.className = 'btn';
      del.textContent = '✕';
      del.setAttribute('aria-label', '削除');
      del.disabled = setup.names.length <= S.MIN_PLAYERS;
      del.addEventListener('click', () => { setup.names.splice(i, 1); setup.chars.splice(i, 1); renderPlayers(); });
      row.append(av, input, del);
      wrap.appendChild(row);
    });
    $('add-player').disabled = setup.names.length >= S.MAX_PLAYERS;
  }

  function openPicker(i) {
    pickingFor = i;
    const grid = $('picks');
    grid.innerHTML = '';
    for (const c of S.CHARACTERS) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick' + (setup.chars[i] === c.id ? ' selected' : '');
      b.dataset.char = c.id;
      b.disabled = setup.chars.includes(c.id) && setup.chars[i] !== c.id;
      b.innerHTML = `${CHAR_ART[c.id]()}<span>${c.name}</span>`;
      b.addEventListener('click', () => { setup.chars[i] = c.id; closePicker(); renderPlayers(); });
      grid.appendChild(b);
    }
    $('picker-overlay').hidden = false;
  }

  function closePicker() { $('picker-overlay').hidden = true; pickingFor = null; }

  function startGame() {
    const names = setup.names.map((n) => n.trim());
    store.set(KEY_SETUP, { size: setup.size, difficulty: setup.difficulty, names, chars: setup.chars });
    state = S.createGame({ size: setup.size, difficulty: setup.difficulty, names, chars: setup.chars });
    store.set(KEY_GAME, state);
    enterPlay();
  }

  // ---------- ゲーム画面 ----------
  function enterPlay() {
    busy = false;
    visPos = null;
    resetRollButton();
    show('screen-play');
    renderBoard();
    renderHeader();
    if (state.lastMove) showCard(state.lastMove); // 復帰時: 指令カードの途中だった
    else scrollToTile(state.players[state.turn].pos, false);
  }

  function computeCols() {
    const w = Math.min(window.innerWidth, 960) - 32;
    if (state.size === 16) return 4;
    if (state.size === 32) return w >= 700 ? 8 : 4;
    return w >= 700 ? 10 : 5;
  }

  /** 蛇行順で次のマスがどちらにあるか: right / left / down / null(ゴール) */
  function linkDir(index) {
    if (index >= state.size - 1) return null;
    if (index % cols === cols - 1) return 'down';
    return Math.floor(index / cols) % 2 === 0 ? 'right' : 'left';
  }

  function renderBoard() {
    cols = computeCols();
    const board = $('board');
    board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    board.innerHTML = '';
    for (const t of state.board) {
      const el = document.createElement('div');
      const dir = linkDir(t.index);
      el.className = `tile cat-${t.cat}` + (dir ? ` link-${dir}` : '');
      el.dataset.index = t.index;
      const row = Math.floor(t.index / cols);
      const col = row % 2 === 0 ? t.index % cols : cols - 1 - (t.index % cols); // 蛇行
      el.style.gridRow = row + 1;
      el.style.gridColumn = col + 1;
      const c = S.CATS[t.cat];
      const num = t.cat === 'start' || t.cat === 'goal' ? '' : t.index;
      el.innerHTML = `<span class="band"></span><span class="num">${num}</span><span class="label">${c.label}</span><span class="icon">${ICON_ART[t.cat]()}</span><div class="tokens"></div>`;
      el.addEventListener('click', () => peek(t));
      board.appendChild(el);
    }
    renderTokens();
  }

  function tileEl(index) { return $('board').querySelector(`.tile[data-index="${index}"]`); }

  function renderTokens() {
    for (const el of $('board').querySelectorAll('.tokens')) { el.innerHTML = ''; el.classList.remove('many', 'n2'); }
    for (const el of $('board').querySelectorAll('.tile.active')) el.classList.remove('active');
    state.players.forEach((p, i) => {
      const pos = visPos && visPos.player === i ? visPos.pos : p.pos;
      const tk = document.createElement('span');
      tk.className = 'token' + (visPos && visPos.player === i ? ' moving' : '');
      setAvatar(tk, p.char, p.color);
      tk.title = p.name;
      tileEl(pos).querySelector('.tokens').appendChild(tk);
    });
    for (const el of $('board').querySelectorAll('.tokens')) {
      if (el.children.length > 3) el.classList.add('many');
      else if (el.children.length > 1) el.classList.add('n2');
    }
    if (state.phase === 'play') tileEl(state.players[state.turn].pos).classList.add('active');
  }

  function renderHeader() {
    const p = state.players[state.turn];
    setAvatar($('turn-avatar'), p.char, p.color);
    $('turn-name').textContent = `${p.name} さんの番!`;
    const st = $('standings');
    st.innerHTML = '';
    state.players.forEach((q, i) => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (i === state.turn ? ' current' : '');
      const where = q.rank !== null ? `🏁 ${q.rank}着` : q.pos === 0 ? 'START' : `${q.pos}`;
      const av = document.createElement('span');
      av.className = 'avatar sm';
      setAvatar(av, q.char, q.color);
      chip.appendChild(av);
      chip.insertAdjacentHTML('beforeend', `${escapeHtml(q.name)} <b>${where}</b>`);
      st.appendChild(chip);
    });
  }

  function scrollToTile(index, smooth = true) {
    const el = tileEl(index);
    if (el) el.scrollIntoView({ block: 'center', behavior: smooth && !reduced ? 'smooth' : 'auto' });
  }

  function resetRollButton() {
    renderDie($('die'), 6);
    $('roll-label').textContent = 'サイコロを振る';
    $('roll').disabled = false;
  }

  async function onRoll() {
    if (busy || !state || state.phase !== 'play') return;
    busy = true;
    $('roll').disabled = true;
    hidePeek();
    const roll = 1 + Math.floor(Math.random() * 6);
    const next = S.applyRoll(state, roll);
    store.set(KEY_GAME, next); // アニメ中にリロードされても結果は残す
    const mv = next.lastMove;

    await spinDie($('die'), roll, 700);
    $('roll-label').textContent = `${roll} が出た!`;
    await sleep(500);

    for (const pos of mv.path) {
      visPos = { player: mv.player, pos };
      renderTokens();
      scrollToTile(pos);
      await sleep(230);
    }
    visPos = null;
    state = next;
    renderTokens();
    renderHeader();
    const landed = tileEl(mv.to);
    landed.classList.add('landed');
    await sleep(200);
    showCard(mv);
  }

  function showConfetti() {
    const box = $('confetti');
    box.innerHTML = '';
    const colors = ['#ff4d4d', '#3b8cff', '#2ec27e', '#ffd93d', '#b56cff', '#ff9f1c', '#fff'];
    for (let i = 0; i < 50; i++) {
      const piece = document.createElement('i');
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = `${Math.random() * 1.2}s`;
      piece.style.animationDuration = `${2.2 + Math.random() * 1.4}s`;
      piece.style.transform = `rotate(${Math.random() * 360}deg)`;
      box.appendChild(piece);
    }
    box.hidden = false;
  }

  function showCard(mv) {
    const p = state.players[mv.player];
    const tile = state.board[mv.to];
    const finished = mv.finished;
    const cat = finished ? 'goal' : tile.cat;
    const c = S.CATS[cat];
    setAvatar($('card-avatar'), p.char, p.color);
    $('card-who').textContent = finished ? `${p.name} さん(${CHAR_NAME[p.char]})` : `${p.name} さん(${CHAR_NAME[p.char]}) → マス ${mv.to}`;
    $('card-icon').innerHTML = ICON_ART[cat]();
    $('card-cat').textContent = c.label;
    $('card-sub').textContent = mv.bounced ? 'ゴールで折り返し!' : '';
    if (finished) $('card-text').textContent = `${p.rank}着でゴール! やったね!`;
    else if (cat === 'rest') $('card-text').textContent = 'セーフ! 何もなし';
    else $('card-text').textContent = tile.text;
    const extra = !finished && tile.extraDice;
    $('card-extra').hidden = !extra;
    $('extra-result').textContent = '';
    $('extra-dice').disabled = false;
    renderDie($('extra-die'), 6);
    $('card').className = `card cat-${cat}`;
    $('card-overlay').hidden = false;
    if (finished) showConfetti();
    $('card-ok').focus();
  }

  async function onExtraDice() {
    const btn = $('extra-dice');
    btn.disabled = true;
    const r = 1 + Math.floor(Math.random() * 6);
    await spinDie($('extra-die'), r, 600);
    $('extra-result').textContent = `${r} が出た!`;
  }

  function onCardOk() {
    $('card-overlay').hidden = true;
    $('confetti').hidden = true;
    state = S.endTurn(state);
    if (state.phase === 'result') {
      store.del(KEY_GAME);
      showResult();
      return;
    }
    store.set(KEY_GAME, state);
    busy = false;
    resetRollButton();
    renderHeader();
    renderTokens();
    scrollToTile(state.players[state.turn].pos);
  }

  function onEnd() {
    if (!state || state.phase !== 'play') return;
    if (!confirm('ゲームを終了して結果を見ますか?\n(未ゴールの人は進んでいる順で順位が付きます)')) return;
    $('card-overlay').hidden = true;
    $('confetti').hidden = true;
    state = S.finishEarly(state);
    store.del(KEY_GAME);
    showResult();
  }

  function peek(t) {
    const box = $('peek');
    const c = S.CATS[t.cat];
    let body;
    if (t.cat === 'start') body = 'スタート地点。サイコロの目だけ進みます。';
    else if (t.cat === 'goal') body = 'ゴール。ぴったり止まらないと超えた分だけ戻ります。';
    else if (t.cat === 'rest') body = '休憩。何もなし。';
    else body = t.text;
    const head = t.cat === 'start' || t.cat === 'goal' ? `${c.icon} ${c.label}` : `マス ${t.index} · ${c.icon} ${c.label}`;
    box.innerHTML = `<div class="head">${head}</div>${escapeHtml(body)}`;
    box.hidden = false;
    clearTimeout(peekTimer);
    peekTimer = setTimeout(hidePeek, 4000);
  }

  function hidePeek() { $('peek').hidden = true; clearTimeout(peekTimer); }

  // ---------- 結果 ----------
  function showResult() {
    busy = false;
    const ranked = S.ranking(state);
    const podium = $('podium');
    podium.innerHTML = '';
    const top = ranked.slice(0, 3);
    const order = [top[1], top[0], top[2]].filter(Boolean);
    const medals = ['🥇', '🥈', '🥉'];
    for (const p of order) {
      const spot = document.createElement('div');
      spot.className = `spot p${p.rank}`;
      const av = document.createElement('span');
      av.className = 'avatar';
      setAvatar(av, p.char, p.color);
      spot.appendChild(av);
      spot.insertAdjacentHTML('beforeend', `<span class="pname">${escapeHtml(p.name)}</span><div class="block">${medals[p.rank - 1]}</div>`);
      podium.appendChild(spot);
    }
    const list = $('ranking');
    list.innerHTML = '';
    ranked.forEach((p, i) => {
      const last = i === ranked.length - 1;
      if (i < 3 && !last) return;
      if (i < 3 && last) { // 最下位が表彰台にいる(3人以下)
        list.insertAdjacentHTML('beforeend', `<p class="last-note">🍻 ${escapeHtml(p.name)} さんが最下位! 罰ゲームはみんなで決めてね</p>`);
        return;
      }
      const row = document.createElement('div');
      row.className = 'rank-row panel' + (last ? ' last' : '');
      const av = document.createElement('span');
      av.className = 'avatar';
      setAvatar(av, p.char, p.color);
      const note = last ? '<span class="note">🍻 最下位! 罰ゲームはみんなで決めてね</span>' : '';
      row.innerHTML = `<span class="medal">${p.rank}位</span>`;
      row.appendChild(av);
      row.insertAdjacentHTML('beforeend', `<span class="name"><b>${escapeHtml(p.name)}</b>${note}</span>`);
      list.appendChild(row);
    });
    show('screen-result');
  }

  // ---------- 初期化 ----------
  function init() {
    const saved = store.get(KEY_SETUP);
    if (saved && typeof saved === 'object') {
      if (S.SIZES.includes(saved.size)) setup.size = saved.size;
      if (S.DIFFICULTIES[saved.difficulty]) setup.difficulty = saved.difficulty;
      if (Array.isArray(saved.names) && saved.names.length >= S.MIN_PLAYERS && saved.names.length <= S.MAX_PLAYERS) {
        setup.names = saved.names.map((n) => String(n ?? ''));
        const chars = Array.isArray(saved.chars) ? saved.chars : [];
        const ok = chars.length === setup.names.length && chars.every((c) => CHAR_IDS.includes(c)) && new Set(chars).size === chars.length;
        setup.chars = ok ? chars.slice() : CHAR_IDS.slice(0, setup.names.length);
      }
    }
    renderChoices();
    renderPlayers();
    renderDie($('die'), 6);

    const game = store.get(KEY_GAME);
    const resumable = game && game.version === 1 && game.phase === 'play' && Array.isArray(game.board)
      && game.players.every((p) => CHAR_IDS.includes(p.char));
    $('resume-banner').hidden = !resumable;

    $('add-player').addEventListener('click', () => { setup.names.push(''); setup.chars.push(firstFreeChar()); renderPlayers(); });
    $('start').addEventListener('click', startGame);
    $('resume').addEventListener('click', () => { state = game; enterPlay(); });
    $('discard').addEventListener('click', () => { store.del(KEY_GAME); $('resume-banner').hidden = true; });
    $('picker-close').addEventListener('click', closePicker);
    $('picker-overlay').addEventListener('click', (e) => { if (e.target === $('picker-overlay')) closePicker(); });
    $('roll').addEventListener('click', onRoll);
    $('card-ok').addEventListener('click', onCardOk);
    $('extra-dice').addEventListener('click', onExtraDice);
    $('end').addEventListener('click', onEnd);
    $('peek').addEventListener('click', hidePeek);
    $('again').addEventListener('click', () => { startGame(); });
    $('to-setup').addEventListener('click', () => { $('resume-banner').hidden = true; renderChoices(); renderPlayers(); show('screen-setup'); });
    window.addEventListener('resize', () => {
      if (!state || $('screen-play').hidden) return;
      if (computeCols() !== cols) renderBoard();
    });
  }

  init();
})();
</script>
</body>
</html>
